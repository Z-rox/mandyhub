[package]
name = "mandyhub"
version = "0.1.6"
edition = "2021"
description = "Mandyhub: a community launcher for VIctory-based projects: pick a repo from PortWatch or a custom link, check the game files, build and play."
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
rfd = "0.14"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3
strip = true
